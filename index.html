const $=s=>document.querySelector(s), esc=s=>String(s??'—').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const num=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0}); const money=n=>'¥'+num(n); const days=r=>Number(String(r['等待/转运时长']||'').match(/[\d.]+/)?.[0]||0);

function customers(){const m=new Map(); D.orders.forEach(r=>{const k=r['客户编码'];if(!m.has(k))m.set(k,{id:k,name:k,orders:0,last:r['拣货日期'],status:'正常'});const x=m.get(k);x.orders++;if(String(r['拣货日期'])>String(x.last))x.last=r['拣货日期']});D.focus.forEach(r=>{if(m.has(r['客户编码'])){let x=m.get(r['客户编码']);x.name=r['客户名称']||x.name;x.status=r['优先级'].startsWith('P0')?'风险客户':r['优先级'].startsWith('P1')?'重点关注':'正常'}});return [...m.values()].sort((a,b)=>b.orders-a.orders)}
function taskList(){let a=D.alerts.filter(r=>r['预警阶段']==='问题件'||days(r)>7).map(r=>({id:'a-'+r['运单号'],kind:'urgent',title:`运单异常：${r['运单号']}`,desc:`${r['客户编码']} · ${r['预警阶段']} · ${r['等待/转运时长']}`}));let r=D.receivables.filter(x=>x['收款状态']==='高风险').map(x=>({id:'r-'+x['客户编码'],kind:'urgent',title:`催收提醒：${x['用户']}`,desc:`未支付 ${money(x['未支付'])} · ${x['结算方式']}`}));let f=D.focus.filter(x=>x['优先级'].startsWith('P0')).map(x=>({id:'f-'+x['客户编码'],kind:'normal',title:`客户跟进：${x['客户名称']||x['客户编码']}`,desc:x['标签']}));return [...a,...r,...f].slice(0,30)}
function tag(v){let c=v==='高风险'||String(v).includes('严重')||String(v).includes('P0')?'red':v==='重点关注'||String(v).includes('延迟')||String(v).includes('P1')?'yellow':v==='正常'||String(v).includes('已签收')?'green':'blue';return `<span class="tag ${c}">${esc(v)}</span>`}
function table(cols,rows){return rows.length?`<div class="table"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[0]==='运单号'?`<strong>${esc(r[c[0]])}</strong>`:esc(r[c[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">没有符合条件的记录</div>'}
function today(){let tasks=taskList(),done=tasks.filter(t=>state.tasks[t.id]==='done').length,alert=D.alerts.filter(r=>r['预警阶段']==='问题件'||days(r)>7),due=D.receivables.filter(r=>r['收款状态']==='高风险');return `<div class="grid metrics">${[['今日待处理',tasks.length,'red'],['异常运单',alert.length,'red'],['待签收',D.alerts.length,'yellow'],['待报价',state.quotes.filter(x=>x.status==='待报价').length,'yellow'],['待收款',due.length,'yellow'],['待跟进客户',D.focus.length,'blue']].map(x=>`<section class="card metric ${x[2]}"><span>${x[0]}</span><b>${x[1]}</b><small>方涛负责范围</small></section>`).join('')}</div><div class="grid two" style="margin-top:16px"><section class="card"><div class="section-head"><div><h2>今日必须处理</h2><p>按异常、应收与客户风险优先级排序</p></div><span class="tag red">${tasks.length} 项待办</span></div><div class="task-list">${tasks.slice(0,10).map(t=>`<div class="task ${t.kind} ${state.tasks[t.id]==='done'?'done':''}"><i></i><div><strong>${esc(t.title)}</strong><small>${esc(t.desc)}</small></div><div class="actions"><button onclick="showTask('${t.id}')">详情</button><button onclick="setTask('${t.id}','processing')">处理中</button><button onclick="setTask('${t.id}','done')">完成</button></div></div>`).join('')}</div></section><aside class="card summary"><div><h2>今日完成情况</h2><p class="muted">完成事项会保存在此浏览器</p></div><div class="summary-item"><span>今日任务</span><b>${tasks.length}</b></div><div class="summary-item"><span>已完成</span><b>${done}</b></div><div><div style="display:flex;justify-content:space-between"><span>完成率</span><strong>${tasks.length?Math.round(done/tasks.length*100):0}%</strong></div><div class="bar"><i style="width:${tasks.length?done/tasks.length*100:0}%"></i></div></div><div class="note">已纳入：物流异常、重点客户与高风险应收。报价和沟通记录可在对应页面录入。</div></aside></div>`}
function customerPage(){let rows=customers().filter(x=>!state.q||JSON.stringify(x).toLowerCase().includes(state.q.toLowerCase()));return `<section class="card"><div class="section-head"><div><h2>我的客户</h2><p>仅显示方涛负责的客户；最近联系时间来自本工作台录入记录</p></div><div class="filters"><input placeholder="搜索客户" value="${esc(state.q)}" oninput="state.q=this.value;render()"></div></div>${table([['name','客户'],['status','客户状态'],['orders','近三月运单'],['last','最近下单'],['contact','最近联系']],rows.map(x=>({...x,contact:(state.records.find(r=>r.customer===x.id)||{}).time||'暂无记录'})))}</section>`}
function shipmentPage(){let all=D.orders.filter(r=>!state.q||JSON.stringify(r).toLowerCase().includes(state.q.toLowerCase()));let view=state.filter==='overdue'?D.alerts.filter(r=>days(r)>3):state.filter==='alerts'?D.alerts.filter(r=>days(r)>7):all;return `<section class="card"><div class="section-head"><div><h2>我的运单</h2><p>运输、签收与异常由当天运单报表生成</p></div><div class="filters"><select onchange="state.filter=this.value;render()"><option value="all">全部运单</option><option value="overdue">超时未签收</option><option value="alerts">异常运单</option></select><input placeholder="搜索运单号/客户/服务" value="${esc(state.q)}" oninput="state.q=this.value;render()"></div></div>${table([['运单号','运单号'],['客户编码','客户'],['服务','运输渠道'],['状态','当前状态'],['拣货日期','拣货时间']],view.slice(0,500))}</section>`}

const FollowUpStore=(()=>{const key='fangtao-shipment-followups-v1';let read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};let write=data=>localStorage.setItem(key,JSON.stringify(data));return {getShipmentFollowUps:id=>(read()[id]||[]).slice().sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt)),addShipmentFollowUp(id,record){let data=read();data[id]=[record,...(data[id]||[])].sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt));write(data);return record},updateShipmentFollowStatus(id,status){let latest=this.getShipmentFollowUps(id)[0];return latest?this.addShipmentFollowUp(id,{...latest,status,content:'',createdAt:new Date().toISOString(),nextFollowTime:''}):null},getLatestShipmentFollowUp(id){return this.getShipmentFollowUps(id)[0]||null},getDueFollowUps(){return Object.entries(read()).filter(([,rows])=>{let latest=rows.slice().sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt))[0];return latest?.nextFollowTime&&Date.parse(latest.nextFollowTime)<=Date.now()}).map(([shipmentId])=>shipmentId)}}})();
state.followStatus ||= '全部';state.alertSort ||= 'stalled';
const followStatuses=['待跟进','跟进中','等待渠道回复','等待客户回复','已解决'];
const followStatusShort=s=>({'等待渠道回复':'等渠道','等待客户回复':'等客户'}[s]||s);
const followTone=s=>s==='已解决'?'done':s.includes('等待')?'wait':s==='待跟进'?'red':'blue';
const isoLocal=d=>{let p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const displayTime=v=>v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—';
function followInfo(row){let id=String(row['运单号']||'');let latest=FollowUpStore.getLatestShipmentFollowUp(id);let status=latest?.status||'待跟进',due=latest?.nextFollowTime&&Date.parse(latest.nextFollowTime)<=Date.now(),overdue=due?Math.floor((Date.now()-Date.parse(latest.nextFollowTime))/86400000):0;return {id,latest,status,due,overdue}}
function followReminder(info){if(!info.latest?.nextFollowTime)return '';let when=new Date(info.latest.nextFollowTime),today=new Date();today.setHours(0,0,0,0);let diff=Math.floor((when-today)/86400000),label=info.due?(info.overdue>0?`逾期${info.overdue}天`:'今日待跟进'):(diff===1?`下次：明天 ${when.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}`:`下次：${when.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}`);return `<span class="followup-reminder ${info.due?'due':''}">${label}</span>`}
function followupOpen(id){let row=D.alerts.find(x=>String(x['运单号'])===String(id));if(!row)return;let info=followInfo(row),history=FollowUpStore.getShipmentFollowUps(info.id),transport=row['渠道类型']||'—';$('#task-detail').innerHTML=`<aside class="detail-panel followup-panel" role="dialog" aria-modal="true" aria-label="预警跟进管理"><div class="detail-top"><div><span class="tag ${followTone(info.status)}">${esc(followStatusShort(info.status))}</span><h2>预警跟进管理</h2></div><button class="close" onclick="closeTask()">关闭</button></div><div class="followup-meta"><div><span>运单号</span><strong>${esc(info.id)}</strong></div><div><span>客户</span><strong>${esc(row['客户编码'])}</strong></div><div><span>运输方式</span><strong>${esc(transport)}</strong></div><div><span>服务</span><strong>${esc(row['服务'])}</strong></div><div><span>当前预警</span><strong>${esc(row['预警类型'])}</strong></div><div><span>当前停滞时间</span><strong>${esc(row['等待/转运时长'])}</strong></div><div><span>最后路由时间</span><strong>${esc(row['最后路由时间明细'])}</strong></div><div><span>未支付应收</span><strong>${money(row['未支付应收'])}</strong></div></div><div class="detail-card"><small>最后路由</small><p>${esc(row['最后路由'])}</p></div><form class="followup-form" onsubmit="saveShipmentFollowUp(event,'${esc(info.id)}')"><label>当前跟进状态<select name="status">${followStatuses.map(s=>`<option ${s===info.status?'selected':''}>${s}</option>`).join('')}</select></label><label>本次跟进内容<textarea name="content" required placeholder="记录渠道回复、客户沟通与处理进展"></textarea></label><div class="followup-grid"><label>下次跟进时间<input name="nextFollowTime" type="datetime-local" value=""></label><label>跟进人<input name="user" value="方涛" required></label></div><button>保存本次跟进</button></form><div class="followup-history"><h3>跟进历史（${history.length}）</h3>${history.length?history.map(x=>`<article class="followup-item"><div class="followup-item-head"><div><strong>${esc(displayTime(x.createdAt))}</strong><small> · ${esc(x.user||'方涛')}</small></div><span class="tag ${followTone(x.status)}">${esc(followStatusShort(x.status))}</span></div><p>${esc(x.content||'仅更新跟进状态')}</p>${x.nextFollowTime?`<small>下次跟进：${esc(displayTime(x.nextFollowTime))}</small>`:''}</article>`).join(''):'<div class="empty">尚无跟进记录。保存后将按时间倒序保留在这里。</div>'}</div></aside>`;$('#task-detail').classList.add('open')}
function saveShipmentFollowUp(event,id){event.preventDefault();let f=new FormData(event.target),row=D.alerts.find(x=>String(x['运单号'])===String(id));FollowUpStore.addShipmentFollowUp(id,{shipmentId:id,customerId:row?.['客户编码']||'',status:f.get('status'),content:f.get('content').trim(),user:f.get('user').trim()||'方涛',createdAt:new Date().toISOString(),nextFollowTime:f.get('nextFollowTime')||''});closeTask();render()}
const monitorRowsBeforeFollowup=monitorRows;monitorRows=()=>{let rows=monitorRowsBeforeFollowup().filter(r=>{let i=followInfo(r);return state.followStatus==='全部'||(state.followStatus==='今日待跟进'?i.due:state.followStatus==='逾期未跟进'?i.due&&i.overdue>0:i.status===state.followStatus)});return rows.sort((a,b)=>state.alertSort==='unfollowed'?(Date.parse(followInfo(a).latest?.createdAt||a['最后路由时间明细']||0)-Date.parse(followInfo(b).latest?.createdAt||b['最后路由时间明细']||0)):days(b)-days(a))};
const alertPageBeforeFollowup=alertPage;alertPage=function(){if(state.alertView==='signed')return alertPageBeforeFollowup();let stages=['出仓延迟','头程延迟','清关延迟','尾程延迟','严重滞后'],rows=monitorRows(),due=new Set(FollowUpStore.getDueFollowUps());let cols=[['运单号','运单号'],['客户编码','客户'],['用户等级','等级'],['渠道类型','渠道'],['服务','服务'],['预警类型','预警阶段'],['等待/转运时长','路由停滞 / 等待'],['最后路由时间明细','最后路由时间'],['未支付应收','未支付应收'],['最后路由','最后路由'],['跟进状态','跟进状态'],['跟进','跟进']];let cell=(r,c)=>{let v=r[c];if(c==='运单号')return `<strong>${esc(v)}</strong>`;if(c==='预警类型')return `<span class="stage-label ${alertTone2(v)}">${esc(v)}</span>`;if(c==='渠道类型')return tag(v);if(c==='未支付应收')return money(v);if(c==='最后路由')return `<span class="route" title="${esc(v)}">${esc(v)}</span>`;if(c==='跟进状态'){let i=followInfo(r);return `<span class="tag followup-tag ${followTone(i.status)}" title="${esc(i.status)}">${esc(followStatusShort(i.status))}</span>${followReminder(i)}`}if(c==='跟进'){let i=followInfo(r);return `<button class="followup-action" onclick="followupOpen('${esc(String(r['运单号']))}')">${i.latest?'查看跟进':'跟进'}</button>`}return esc(v)};return `<div class="alert-workbench"><div class="page-title"><div><h2>预警中心</h2><p>未签收运单按最后路由更新时间识别停滞；人工跟进不会改变运输预警</p></div><div class="followup-summary"><span class="tag red">${rows.length} 条监控记录</span><button class="followup-due" onclick="state.followStatus='今日待跟进';render()">今日待跟进 ${due.size}</button></div></div><div class="alert-toolbar"><div class="view-switch"><button class="active">预警监控</button><button onclick="state.alertView='signed';render()">正常签收</button></div><div class="mode-switch"><span>运输方式</span>${['全部','空运','海运','其他'].map(x=>`<button class="${state.alertMode===x?'active':''}" onclick="state.alertMode='${x}';render()">${x}</button>`).join('')}</div></div><div class="stage-kpis">${stages.map(s=>{let a=D.alerts.filter(r=>(state.alertMode==='全部'||r['渠道类型']===state.alertMode)&&r['预警类型']===s),tone=alertTone2(s);return `<button class="stage-card ${tone} ${state.alertStage===s?'active':''}" onclick="state.alertStage=state.alertStage==='${s}'?'全部':'${s}';render()"><span>${s}</span><strong>${a.length}</strong><small>${new Set(a.map(r=>r['客户编码'])).size} 家客户</small></button>`}).join('')}</div><section class="card alert-table-card"><div class="alert-table-head"><div><h2>异常运单监控列表</h2><p>${state.alertSort==='unfollowed'?'按最长时间未跟进排序':'按最后路由停滞时长降序排列'}</p></div><div class="filters"><input value="${esc(state.q)}" oninput="state.q=this.value;render()" placeholder="搜索运单号/客户/服务"><select class="followup-filter" onchange="state.followStatus=this.value;render()">${['全部',...followStatuses,'今日待跟进','逾期未跟进'].map(s=>`<option value="${s}" ${state.followStatus===s?'selected':''}>${s}</option>`).join('')}</select><select class="followup-filter" onchange="state.alertSort=this.value;render()"><option value="stalled" ${state.alertSort==='stalled'?'selected':''}>停滞时间降序</option><option value="unfollowed" ${state.alertSort==='unfollowed'?'selected':''}>最长时间未跟进</option></select><button class="copy" onclick="copyNos()">复制当前运单号</button></div></div>${state.copyMessage?`<p class="copy-status">${esc(state.copyMessage)}</p>`:''}<div class="table"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,500).map(r=>`<tr class="${alertTone2(r['预警类型'])}">${cols.map(c=>`<td>${cell(r,c[0])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section></div>`};render();
